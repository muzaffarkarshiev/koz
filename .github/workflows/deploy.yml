name: Saytni yangilash va joylash

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # har 10 daqiqada reys ma'lumotini yangilaydi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windy kesh (12 soatda bir yangilanadi)
        uses: actions/cache@v4
        with:
          path: windy_cache
          key: windy-${{ github.run_id }}
          restore-keys: windy-
      - name: Reys, kamera va TV ma'lumotini olish
        run: python server.py --dump site/data
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          WINDY_CACHE_DIR: windy_cache
        continue-on-error: true
      - name: Sayt fayllarini tayyorlash
        run: mkdir -p site && cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
